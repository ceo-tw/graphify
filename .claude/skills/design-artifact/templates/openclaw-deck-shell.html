  <script>
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "light",
      "density": "comfortable"
    }/*EDITMODE-END*/;

  <!-- Tweaks listener first, then announce -->
  <script>
    (function initTweaks(){
      const state = Object.assign({}, TWEAK_DEFAULTS);

      function applyTheme(t) {
        document.documentElement.classList.toggle('dark', t === 'dark');
        try { localStorage.setItem('oafw-theme', t); } catch (e) {}
      }
      function applyDensity(d) {
        document.documentElement.dataset.density = d;
      }
      function applyAll() {
        applyTheme(state.theme);
        applyDensity(state.density);
        const panel = document.getElementById('tweaks-panel');
        if (panel) {
          const themeSel = panel.querySelector('[data-key="theme"]');
          const densitySel = panel.querySelector('[data-key="density"]');
          if (themeSel) themeSel.value = state.theme;
          if (densitySel) densitySel.value = state.density;
        }
        const toggle = document.querySelector('.theme-toggle');
        if (toggle) toggle.textContent = state.theme === 'dark' ? 'LIGHT' : 'DARK';
      }

      // Restore theme from localStorage if present
      try {
        const saved = localStorage.getItem('oafw-theme');
        if (saved === 'light' || saved === 'dark') state.theme = saved;
      } catch (e) {}

      window.addEventListener('message', (e) => {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === '__activate_edit_mode') {
          document.getElementById('tweaks-panel')?.classList.add('active');
        } else if (e.data.type === '__deactivate_edit_mode') {
          document.getElementById('tweaks-panel')?.classList.remove('active');
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        applyAll();

        // Theme toggle
        document.querySelector('.theme-toggle')?.addEventListener('click', () => {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          applyAll();
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: state.theme } }, '*');
        });

        // Tweaks panel controls
        document.getElementById('tweaks-panel')?.addEventListener('change', (ev) => {
          const key = ev.target?.dataset?.key;
          if (!key) return;
          state[key] = ev.target.value;
          applyAll();
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: state[key] } }, '*');
        });

        // Announce edit mode availability
        try {
          window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        } catch (e) {}
      });

      window.__deckTweaks = state;
    })();
  </script>

  <!-- deck-stage web component definition -->
  <script>
    (function defineDeckStage(){
      class DeckStage extends HTMLElement {
        constructor() {
          super();
          this.index = 0;
          this.sections = [];
          this._onKey = this._onKey.bind(this);
          this._fit = this._fit.bind(this);
        }

        connectedCallback() {
          // NOTE: connectedCallback fires BEFORE <section> children are parsed
          // (classic custom element timing pitfall). Initialization that
          // depends on children happens in _initWithChildren(), invoked from
          // a synchronous inline script AFTER the deck-stage closing tag.
          this._initialized = false;
        }

        static get observedAttributes() { return ['noscale']; }

        attributeChangedCallback(name) {
          if (name === 'noscale' && this._initialized) {
            if (this.hasAttribute('noscale')) {
              window.removeEventListener('resize', this._fit);
              if (this.canvas) this.canvas.style.transform = 'translate(-50%, -50%) scale(1)';
            } else {
              window.addEventListener('resize', this._fit);
              this._fit();
            }
          }
        }

        _initWithChildren() {
          if (this._initialized) return;
          this._initialized = true;

          // Find direct child sections and wrap them into a canvas
          const sections = Array.from(this.children).filter(el => el.tagName === 'SECTION');
          this.sections = sections;
          const total = sections.length;

          // Apply data-screen-label (1-indexed, zero padded)
          sections.forEach((sec, i) => {
            const idx = String(i + 1).padStart(2, '0');
            const title = sec.getAttribute('data-slide-title') || '';
            sec.setAttribute('data-screen-label', `${idx} ${title}`.trim());
            sec.setAttribute('data-om-validate', '');
            // Counter inside each section
            if (!sec.querySelector('.ds-counter')) {
              const c = document.createElement('div');
              c.className = 'ds-counter';
              c.textContent = `${idx} / ${String(total).padStart(2, '0')}`;
              sec.appendChild(c);
            }
          });

          // Wrap existing sections in a canvas wrapper
          const canvas = document.createElement('div');
          canvas.className = 'ds-canvas';
          sections.forEach(sec => canvas.appendChild(sec));
          this.appendChild(canvas);
          this.canvas = canvas;

          // Restore index
          try {
            const saved = parseInt(localStorage.getItem('deck-index') || '0', 10);
            if (!isNaN(saved) && saved >= 0 && saved < total) {
              this.index = saved;
            }
          } catch (e) {}

          this._render();

          if (!this.hasAttribute('noscale')) {
            window.addEventListener('resize', this._fit);
            this._fit();
          }

          document.addEventListener('keydown', this._onKey);

          // Expose navigation API
          this.next = () => this.go(this.index + 1);
          this.prev = () => this.go(this.index - 1);
          this.go = (i) => {
            const total = this.sections.length;
            if (i < 0) i = 0;
            if (i >= total) i = total - 1;
            this.index = i;
            this._render();
            try { localStorage.setItem('deck-index', String(i)); } catch (e) {}
            try { window.parent.postMessage({ slideIndexChanged: i }, '*'); } catch (e) {}
            this.dispatchEvent(new CustomEvent('slide-change', { detail: { index: i, total } }));
          };

          // Expose window.__deck tier-1 API (deck-authoring.md §PPTX Export Contract)
          // getSlideCount()      — total number of slides
          // goToSlide(n)         — 1-indexed; no-op if out of range
          // getCurrentSlide()    — 1-indexed current slide number
          window.__deck = {
            getSlideCount: () => this.sections.length,
            goToSlide: (n) => {
              if (typeof n !== 'number' || n < 1 || n > this.sections.length) return;
              this.go(n - 1);
            },
            getCurrentSlide: () => this.index + 1,
          };

          // Initial broadcast
          try { window.parent.postMessage({ slideIndexChanged: this.index }, '*'); } catch (e) {}
          this.dispatchEvent(new CustomEvent('slide-change', { detail: { index: this.index, total } }));
        }

        disconnectedCallback() {
          window.removeEventListener('resize', this._fit);
          document.removeEventListener('keydown', this._onKey);
        }

        _render() {
          this.sections.forEach((sec, i) => {
            if (i === this.index) sec.setAttribute('data-active', 'true');
            else sec.removeAttribute('data-active');
          });
        }

        _fit() {
          if (!this.canvas) return;
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const scale = Math.min(vw / 1920, vh / 1080);
          this.canvas.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        _onKey(e) {
          // Ignore if focus is on an input/select
          const tag = document.activeElement?.tagName;
          if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

          if (e.key === 'ArrowRight' || e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            this.go(this.index + 1);
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            this.go(this.index - 1);
          } else if (e.key === 'Home') {
            e.preventDefault();
            this.go(0);
          } else if (e.key === 'End') {
            e.preventDefault();
            this.go(this.sections.length - 1);
          }
        }
      }
      customElements.define('deck-stage', DeckStage);
    })();
  </script>

  <!--
    PITFALL 1 FIX: _initWithChildren() is called synchronously here, AFTER the
    deck-stage closing tag so all <section> children are already parsed.
    This script also registers slide-change listeners before calling init so
    the initial slide-change event is captured correctly.
  -->
  <script>
    (function initDeckStages() {
      const counter = document.getElementById('counter-global');
      const progress = document.getElementById('progress-fill');
      document.querySelectorAll('deck-stage').forEach((stage) => {
        if (counter && progress) {
          stage.addEventListener('slide-change', (e) => {
            const { index, total } = e.detail;
            const idx = String(index + 1).padStart(2, '0');
            const tot = String(total).padStart(2, '0');
            counter.textContent = `${idx} / ${tot}`;
            progress.style.width = `${((index + 1) / total) * 100}%`;
          });
        }
        if (typeof stage._initWithChildren === 'function') {
          stage._initWithChildren();
        }
      });
    })();
  </script>
