<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector Spike Single</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #root {
      width: 400px;
      height: 300px;
      background: linear-gradient(135deg, #1e3a5f, #2d6a4f);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      border-radius: 8px;
      position: relative;
    }
    #root p {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      letter-spacing: 2px;
    }
    #root .subtitle {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      text-align: center;
      margin-top: 12px;
    }
    #root .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #root .badge svg {
      width: 24px;
      height: 24px;
      fill: white;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="badge">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <p>Hello 안녕</p>
    <span class="subtitle">Vector Export Spike — Single Slide</span>
  </div>
</body>
</html>
