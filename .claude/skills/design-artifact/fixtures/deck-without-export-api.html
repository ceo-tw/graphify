<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deck — Without Export API Fixture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* deck-stage host */
    deck-stage {
      display: block;
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    /* Scale wrapper — inner canvas, 1920×1080 */
    deck-stage .ds-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
      /* transform set by JS */
    }

    /* noscale: bypass transform, just stretch */
    deck-stage[noscale] .ds-canvas {
      transform: none !important;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Slides */
    deck-stage .ds-canvas > section {
      display: none;
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    deck-stage .ds-canvas > section[data-active="true"] {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @media print {
      deck-stage .ds-canvas > section {
        display: block;
        page-break-after: always;
        width: 100%;
        height: 100vh;
      }
    }

    /* Slide content styles */
    .slide-bg-dark {
      background: #0f0f0f;
      color: #f0f0f0;
    }

    .slide-bg-light {
      background: #f5f5f5;
      color: #111;
    }

    .slide-title {
      font-size: 96px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      text-wrap: pretty;
      text-align: center;
      max-width: 1400px;
    }

    .slide-subtitle {
      font-size: 48px;
      font-weight: 400;
      margin-top: 32px;
      opacity: 0.6;
      text-align: center;
      max-width: 1200px;
      text-wrap: pretty;
    }

    /* Slide counter */
    #slide-counter {
      position: fixed;
      bottom: 24px;
      right: 32px;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.45);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      z-index: 100;
      pointer-events: none;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

<deck-stage>
  <section class="slide-bg-dark">
    <h1 class="slide-title">Slide One</h1>
    <p class="slide-subtitle">First section — no export API fixture</p>
  </section>

  <section class="slide-bg-light">
    <h1 class="slide-title">Slide Two</h1>
    <p class="slide-subtitle">Second section — ArrowRight navigates here</p>
  </section>
</deck-stage>

<div id="slide-counter" aria-live="polite"></div>

<!-- Init after parse: at this point all <section> children are in the DOM -->
<script>
(function () {
  'use strict';

  class DeckStage extends HTMLElement {
    constructor() {
      super();
      this._index = 0;
      this._sections = [];
      this._canvas = null;
      this._ro = null;
      this._onKey = this._onKey.bind(this);
    }

    connectedCallback() {
      // Children may not be parsed yet — _initWithChildren is called externally
      // after the closing </deck-stage> tag (see init block below).
    }

    _initWithChildren() {
      // Wrap sections in a scale canvas
      this._canvas = document.createElement('div');
      this._canvas.className = 'ds-canvas';

      // Move all direct <section> children into the canvas
      const rawSections = Array.from(this.querySelectorAll(':scope > section'));
      rawSections.forEach(s => this._canvas.appendChild(s));
      this.appendChild(this._canvas);

      this._sections = Array.from(this._canvas.querySelectorAll(':scope > section'));

      // Attach data attributes
      this._sections.forEach((s, i) => {
        const label = String(i + 1).padStart(2, '0') + ' ' + (s.querySelector('h1')?.textContent?.trim() || 'Slide');
        s.setAttribute('data-screen-label', label);
        s.setAttribute('data-om-validate', 'true');
        s.setAttribute('data-active', 'false');
      });

      // Restore saved index
      const saved = parseInt(localStorage.getItem('deck-index') || '0', 10);
      this._index = (saved >= 0 && saved < this._sections.length) ? saved : 0;
      this._activate(this._index, false);

      // Scale (unless noscale attribute present)
      this._setupScale();

      // Keyboard
      document.addEventListener('keydown', this._onKey);
    }

    _setupScale() {
      if (this.hasAttribute('noscale')) return;

      const fit = () => {
        const vw = this.offsetWidth || window.innerWidth;
        const vh = this.offsetHeight || window.innerHeight;
        const scale = Math.min(vw / 1920, vh / 1080);
        const tx = (vw - 1920 * scale) / 2;
        const ty = (vh - 1080 * scale) / 2;
        if (this._canvas) {
          this._canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
          this._canvas.style.transformOrigin = '0 0';
          this._canvas.style.top = '0';
          this._canvas.style.left = '0';
        }
      };

      fit();
      this._ro = new ResizeObserver(fit);
      this._ro.observe(this);
    }

    _activate(index, persist) {
      if (index < 0 || index >= this._sections.length) return;
      this._sections.forEach((s, i) => s.setAttribute('data-active', i === index ? 'true' : 'false'));
      this._index = index;

      // Update counter
      const counter = document.getElementById('slide-counter');
      if (counter) counter.textContent = (index + 1) + ' / ' + this._sections.length;

      if (persist !== false) {
        localStorage.setItem('deck-index', String(index));
      }

      // Notify parent
      try {
        window.parent.postMessage({ slideIndexChanged: index }, '*');
      } catch (_) {}
    }

    _onKey(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        if (this._index < this._sections.length - 1) {
          this._activate(this._index + 1, true);
        }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (this._index > 0) {
          this._activate(this._index - 1, true);
        }
      }
    }

    disconnectedCallback() {
      document.removeEventListener('keydown', this._onKey);
      if (this._ro) this._ro.disconnect();
    }
  }

  customElements.define('deck-stage', DeckStage);

  // Synchronously init after children are parsed
  document.querySelectorAll('deck-stage').forEach(stage => stage._initWithChildren());
})();
</script>

</body>
</html>
