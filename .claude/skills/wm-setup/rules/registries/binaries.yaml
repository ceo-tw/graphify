# Binaries Registry
# Single source of truth for required CLI binaries and runtimes
# Bulk rebuild reference:
#   graphify venv: python3.12 -m venv .claude/graphify/.venv && .claude/graphify/.venv/bin/pip install "git+https://github.com/ceo-tw/graphify.git@v4"
#   verify graphify: .claude/graphify/.venv/bin/graphify --version

version: "1.0"
type: "binaries"
last_updated: "2026-04-21"

items:
  # === CRITICAL Priority (hard=true — wm workflow blocked without these) ===

  - id: BIN-001
    name: graphify
    kind: binary
    path: .claude/graphify/.venv/bin/graphify
    priority: CRITICAL
    hard: true
    referenced_by:
      - .claude/skills/wm/SKILL.md (§1 A-1 rule)
      - .claude/agents/review-orchestrator.md (§2 Graphify Fast Pass)
      - .claude/agents/knowledge-graph-navigator.md
      - .claude/skills/wm/rules/processes/bug-fix-complex.md (GAP-5a/5b)
      - .claude/skills/wm/rules/processes/development-process.md (A-2/A-3/C-1)
    install_source: "git+https://github.com/ceo-tw/graphify.git@v4"
    install_command: "python3.12 -m venv .claude/graphify/.venv && .claude/graphify/.venv/bin/pip install 'git+https://github.com/ceo-tw/graphify.git@v4'"
    install_command_editable_fallback: "python3.12 -m venv .claude/graphify/.venv && .claude/graphify/.venv/bin/pip install -e <LOCAL_CLONE_PATH>"
    pypi_forbidden: true      # PyPI graphifyy is upstream; lacks URL-centric features required by wm
    verify_command: ".claude/graphify/.venv/bin/graphify --version"
    version_regex: "^graphify\\s+0\\.5\\."
    required_features:
      - resolve
      - callers
      - callees
      - blast
      - init-ignore
      - "--directed"
    validation:
      type: version_check

  - id: BIN-002
    name: jq
    kind: binary
    priority: CRITICAL
    hard: true
    referenced_by:
      - validator scripts
      - .claude/agents/review-orchestrator.md
      - .claude/hooks/*.sh
    install_command_macos: "brew install jq"
    install_command_linux: "sudo apt-get install -y jq"
    verify_command: "jq --version"
    validation:
      type: binary_exists

  - id: BIN-003
    name: python3.12
    kind: binary
    priority: CRITICAL
    hard: true
    referenced_by:
      - BIN-001 (graphify venv target)
      - .claude/graphify/README.md
    install_command_macos: "brew install python@3.12"
    install_command_linux: "sudo apt-get install -y python3.12 python3.12-venv"
    verify_command: "python3.12 --version"
    validation:
      type: binary_exists

  - id: BIN-007
    name: node
    kind: binary
    priority: CRITICAL
    hard: true
    referenced_by:
      - src/admin-api/ (runtime)
      - src/admin-portal/ (runtime)
      - src/billing-api/ (runtime)
      - scripts/graphify/build-all-graphs.ts
    install_command_macos: "brew install node@22"
    install_command_linux: "sudo apt-get install -y nodejs npm"
    verify_command: "node --version | grep -E '^v(22|23|24)'"
    version_requirement: ">=22"
    validation:
      type: version_check

  - id: BIN-008
    name: npm
    kind: binary
    priority: CRITICAL
    hard: true
    referenced_by:
      - package.json (workspaces)
      - src/admin-api/package.json
      - src/admin-portal/package.json
    install_command_macos: "brew install node@22"
    install_command_linux: "sudo apt-get install -y npm"
    verify_command: "npm --version"
    validation:
      type: binary_exists

  - id: BIN-009
    name: bash
    kind: binary
    priority: CRITICAL
    hard: true
    validation_order: 0
    referenced_by:
      - .claude/skills/wm-setup/scripts/check.sh (declare -A, bash 4+ only)
      - .claude/skills/wm-setup/scripts/install.sh
      - .claude/skills/wm-setup/scripts/_lib.sh
    install_command_macos: "brew install bash"
    install_command_linux: "# usually pre-installed; if not: sudo apt-get install -y bash"
    verify_command: "bash -c 'echo ${BASH_VERSINFO[0]}'"
    version_regex: "^([4-9]|[1-9][0-9])$"
    version_requirement: ">=4.0"
    validation:
      type: version_check
    note: "macOS ships with bash 3.2 for GPL v2 licensing. wm-setup scripts require bash 4+ (associative arrays). /opt/homebrew/bin/bash (Apple Silicon) or /usr/local/bin/bash (Intel) after brew install."

  # === HIGH Priority (hard=true — deploy/K8s workflows) ===

  - id: BIN-004
    name: kubectl
    kind: binary
    priority: HIGH
    hard: true
    referenced_by:
      - .claude/skills/deploy-orbstack/SKILL.md
      - orbstack/
      - eks/
    install_command_macos: "brew install kubectl"
    install_command_linux: "sudo apt-get install -y kubectl"
    verify_command: "kubectl version --client"
    validation:
      type: binary_exists

  - id: BIN-005
    name: docker
    kind: binary
    priority: HIGH
    hard: true
    referenced_by:
      - src/admin-api/Dockerfile
      - src/admin-portal/Dockerfile
      - .claude/skills/deploy-orbstack/SKILL.md
    install_command_macos: "brew install --cask docker"
    install_command_linux: "sudo apt-get install -y docker.io"
    verify_command: "docker ps"
    verify_note: "docker ps verifies daemon is running, not just CLI installed"
    validation:
      type: binary_exists

  # === MEDIUM Priority (hard=false — optional workflows) ===

  - id: BIN-006
    name: gh
    kind: binary
    priority: MEDIUM
    hard: false
    referenced_by:
      - .claude/skills/git-workflow/SKILL.md
      - PR creation commands
    install_command_macos: "brew install gh"
    install_command_linux: "sudo apt-get install -y gh"
    verify_command: "gh --version"
    validation:
      type: binary_exists

# === Summary ===
# CRITICAL (hard=true): 6 (graphify, jq, python3.12, node, npm, bash)
# HIGH (hard=true): 2 (kubectl, docker)
# MEDIUM (hard=false): 1 (gh)
# Total: 9 binaries
# Note: IDs are ordered by logical dependency (graphify=001, jq=002, python=003, kubectl=004, docker=005, gh=006, node=007, npm=008, bash=009)
# Note: BIN-009 (bash) carries validation_order: 0 — must be validated FIRST within the binaries module
#       despite its numeric ID being 009. Reason: all other validator logic may use bash 4+ features.
