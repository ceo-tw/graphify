# Graph Data Registry
# Single source of truth for graphify build artifacts
#
# Bulk rebuild (all 18 domains):
#   node --experimental-strip-types --no-warnings scripts/graphify/build-all-graphs.ts
#
# _global directed graph:
#   .claude/graphify/.venv/bin/graphify build ./src --directed --out-dir .claude/architecture/graph/_global/graphify-out
#
# Single domain rebuild:
#   node --experimental-strip-types --no-warnings scripts/graphify/build-all-graphs.ts --only <domain>

version: "1.0"
type: "graph-data"
last_updated: "2026-04-21"

items:
  # === Build Summary (CRITICAL — wm prerequisite check reads this) ===

  - id: GRAPH-001
    name: build-summary
    kind: file
    path: .claude/architecture/graph/build-summary.json
    priority: CRITICAL
    hard: true
    referenced_by:
      - .claude/skills/wm/SKILL.md (§1 Precondition)
      - .claude/skills/wm-setup/SKILL.md (VERIFY mode)
    install_command: "node --experimental-strip-types --no-warnings scripts/graphify/build-all-graphs.ts"
    verify_command: "test -f .claude/architecture/graph/build-summary.json"
    validation:
      type: file_exists

  # === _global Directed Graph (CRITICAL — review-orchestrator Graphify Fast Pass) ===

  - id: GRAPH-002
    name: _global
    kind: file
    path: .claude/architecture/graph/_global/graphify-out/graph.json
    priority: CRITICAL
    hard: true
    referenced_by:
      - .claude/agents/review-orchestrator.md (§2 Graphify Fast Pass)
      - .claude/agents/knowledge-graph-navigator.md
      - .claude/skills/wm/rules/processes/development-process.md (A-2/A-3/C-1)
    install_command: ".claude/graphify/.venv/bin/graphify build ./src --directed --out-dir .claude/architecture/graph/_global/graphify-out"
    verify_command: "jq -e '.nodes | length > 0' .claude/architecture/graph/_global/graphify-out/graph.json"
    validation:
      type: custom

